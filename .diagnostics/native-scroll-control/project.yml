name: NativeScrollControl
options:
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  NativeScrollControl:
    type: application
    platform: iOS
    sources: [Host.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.codex.diagnostics.scroll-control
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  NativeScrollControlTests:
    type: bundle.unit-test
    platform: iOS
    sources: [../../ios/TimbreAppTests/NativeScrollTrackingControlTests.swift]
    dependencies:
      - target: NativeScrollControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.codex.diagnostics.scroll-control-tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NativeScrollControl.app/NativeScrollControl
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  NativeScrollControl:
    build:
      targets:
        NativeScrollControl: all
        NativeScrollControlTests: [test]
    test:
      targets: [NativeScrollControlTests]

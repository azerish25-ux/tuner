name: Convert artist models
on:
  push:
    branches: ["convert/**"]
    paths:
      - "tools/models/sketchfab/**"
      - ".github/workflows/convert.yml"
permissions:
  contents: write
concurrency:
  group: convert-${{ github.ref }}
  cancel-in-progress: true
jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Search
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/models/sketchfab/search.py build/convert "electric bass guitar|bass guitar|4 string bass|bass guitar pbr|bass guitar low poly|jazz bass|electric bass|bass guitar game ready" 2>&1 | tee build/search.log
          cp build/search.log build/convert/ || true
      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/publish-results.sh "ci-results/${GITHUB_REF_NAME}" build/convert

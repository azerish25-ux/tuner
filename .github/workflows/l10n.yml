name: Localization export
on:
  push:
    branches: ["l10n/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Export English strings from source
        run: |
          set -o pipefail
          mkdir -p ci-out
          xcodebuild -exportLocalizations -project ios/Timbre.xcodeproj -localizationPath ci-out/l10n -exportLanguage en \
            SWIFT_EMIT_LOC_STRINGS=YES 2>&1 | tail -40 | tee ci-out/export.log
          find ci-out/l10n -name "*.xliff" -exec cp {} ci-out/ \;
          ls -la ci-out
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/publish-results.sh ci-results/l10n ci-out

name: Localization export
on:
  push:
    branches: ["main", "l10n/**"]
    paths:
      - ".github/workflows/l10n.yml"
      - "ios/**/*.swift"
      - "ios/project.yml"
      - "tools/l10n/*.py"
  workflow_dispatch:
concurrency:
  group: localization-export-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Export English strings from source
        run: |
          set -euo pipefail
          mkdir -p ci-out
          xcodebuild -exportLocalizations -project ios/Timbre.xcodeproj -localizationPath ci-out/l10n -exportLanguage en \
            SWIFT_EMIT_LOC_STRINGS=YES CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-out/export.log
          XLIFF=ci-out/l10n/en.xcloc/Localized\ Contents/en.xliff
          test -s "$XLIFF"
          cp "$XLIFF" ci-out/en.xliff
          ls -la ci-out
      - name: Handoff and release-critical strings with Xcode's own keys
        # The scanner infers each interpolation's specifier (%lld, %@ …); the export states it. Both reports here use
        # the export's keys, so what translators deliver matches what the app looks up.
        if: success()
        run: |
          set -euo pipefail
          XLIFF=ci-out/en.xliff
          python3 tools/l10n/shipping.py --xliff "$XLIFF" --require-complete 2>&1 | tee ci-out/shipping.log
          python3 tools/l10n/report.py --check --xliff "$XLIFF" --out ci-out/handoff 2>&1 | tee ci-out/report.log
          LOCALES=$(python3 -c 'import sys; sys.path.insert(0,"tools/l10n"); import shipping; print(",".join(loc for loc in shipping.available() if loc != "en"))')
          python3 tools/l10n/critical.py --strict --locales "$LOCALES" --xliff "$XLIFF" --out ci-out 2>&1 | tee ci-out/critical.log
          python3 tools/l10n/lessons.py --strict --out ci-out/lessons.json 2>&1 | tee ci-out/lessons.log
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/publish-results.sh ci-results/l10n ci-out
      - name: Upload localization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-export-${{ github.sha }}
          path: ci-out
          if-no-files-found: error

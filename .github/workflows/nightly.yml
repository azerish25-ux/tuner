# What the pull-request gate (ios.yml) leaves out to stay under 15 minutes: the full iPhone UI tour with its App Store
# captures and the launch-time metric, the unsigned archive, the iPad shelf, the accessibility matrix and the thread
# sanitizer. Runs every night on the default branch, by hand, and on a pull request labelled `captures` (on each push
# while the label is on). Results: ci-results/app, ci-results/ipad, ci-results/a11y-matrix and ci-results/tsan.
name: Nightly and captures
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      priming:
        description: Run the separate experimental simulator priming diagnostic before XCTest
        type: boolean
        default: false
  pull_request:
    types: [labeled, opened, reopened, synchronize]
permissions:
  contents: read
concurrency:
  group: nightly-${{ github.ref }}
  # Only superseded pull-request evidence is canceled; main, manual and scheduled runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  TOUR_PRIMING_ENABLED: ${{ inputs.priming == true || contains(github.event.pull_request.labels.*.name, 'simulator-priming') }}
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
jobs:
  tour-build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'captures')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios && xcodegen generate
      - name: Bind exact toolchain runtime and source fixtures
        run: python3 tools/ci/shared_tour_build.py select ci-out/shared
      - name: Ensure Metal toolchain
        run: bash tools/ci/ensure-metal.sh
      - name: Build app and tests
        id: build
        run: |
          set -o pipefail
          mkdir -p ios/build ci-out
          xcodebuild build-for-testing -project ios/Timbre.xcodeproj -scheme Timbre -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath ios/build/dd CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-out/build.log
      # Publish compiler diagnostics before tests or the independent Release archive can delay them.
      - name: Summarize simulator build immediately
        if: always() && hashFiles('ci-out/build.log') != ''
        run: python3 tools/ci/summarize-log.py ci-out/build.log ci-out/build.summary.txt
      - name: Upload simulator build checkpoint
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && hashFiles('ci-out/build.log') != ''
        with:
          name: nightly-build-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ci-out/build.log
            ci-out/build.summary.txt
          if-no-files-found: error
          retention-days: 14
      - name: Package verified products only after successful build
        if: success()
        run: python3 tools/ci/shared_tour_build.py pack ci-out/shared
      - name: Upload same-run tour products
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tour-products-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/shared
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  tour:
    env:
      TOUR_SHARD: ${{ matrix.shard }}
    needs: tour-build
    # Independent class shards retain every selected case; failures never cancel sibling evidence.
    name: tour (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: captures
            test_class: TimbreUITests
            artifact: results-tour
          - shard: launch
            test_class: LaunchPerformanceUITests
            artifact: results-tour-launch
          - shard: first-session
            test_class: FirstSessionUITests
            artifact: results-tour-first-session
          - shard: lesson-layout
            test_class: LessonAccessibilityLayoutUITests
            artifact: results-tour-lesson-layout
          - shard: song-rails
            test_class: SongShelfRailUITests
            artifact: results-tour-song-rails
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'captures')
    timeout-minutes: 90
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Download exact same-run products
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tour-products-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-build
      - name: Verify and restore shared build
        id: build
        run: python3 tools/ci/shared_tour_build.py restore ci-build
      - name: Boot simulator and allow the microphone
        run: |
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl privacy "$DEVICE_ID" grant microphone com.shahradazerisharghi.timbre || true
      - name: Marketing status bar (9:41, full battery and signal)
        run: |
          # The store frames come from these captures: Apple's 9:41 status bar, not the runner's clock.
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 \
            || xcrun simctl status_bar "$DEVICE_ID" override --time 9:41 \
            || echo "::warning::Could not override the simulator status bar; the captures show the real time"
      - name: Diagnostic simulator priming (not cold-install evidence)
        id: warmup
        if: success() && matrix.shard != 'launch' && env.TOUR_PRIMING_ENABLED == 'true'
        timeout-minutes: 6
        run: |
          PYTHONPATH=tools/ci python3 - <<'PYWARM'
          import os
          from pathlib import Path
          from simulator_warmup import warmup
          warmup(Path('ios/build/dd/Build/Products/Debug-iphonesimulator/Timbre.app'),
                 os.environ['DEVICE_ID'], ['en'], 'en_US', Path('ci-out/warmup'))
          PYWARM
      - name: Upload diagnostic priming receipt before XCTest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && matrix.shard != 'launch'
        with:
          name: tour-warmup-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            ci-out/warmup/status.json
            ci-out/warmup/*.log
            ci-out/warmup/diagnostic-only.png
          if-no-files-found: warn
          retention-days: 14
      - name: Isolate owned simulator after unconfirmed priming cleanup
        id: warmup_cleanup
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.warmup.outcome == 'failure' && hashFiles('ci-out/warmup/status.json') != '' }}
        timeout-minutes: 3
        run: |
          PYTHONPATH=tools/ci python3 - <<'PYCLEAN'
          import os
          from pathlib import Path
          from simulator_cleanup import isolate
          isolate(os.environ['DEVICE_ID'], Path('ci-out/warmup/status.json'), Path('ci-out/warmup-cleanup'))
          PYCLEAN
      - name: Upload owned simulator cleanup receipt before independent XCTest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && steps.warmup.outcome == 'failure'
        with:
          name: tour-warmup-cleanup-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ci-out/warmup-cleanup/
          if-no-files-found: warn
          retention-days: 14
      - name: Selected UI class
        id: tests
        # Priming is diagnostic: still run every unchanged test if it fails, while its failure
        # remains a failed job. The launch-performance shard never primes the application.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # Leave time for compact evidence if this shard hangs; do not retry failed assertions.
        timeout-minutes: ${{ matrix.shard == 'song-rails' && 75 || 60 }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -parallel-testing-enabled NO \
            -only-testing:TimbreUITests/${{ matrix.test_class }} \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -resultBundlePath ios/build/UITests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-out/test.log
      - name: Collect bounded opt-in Songs page trace
        if: always() && matrix.shard == 'song-rails'
        timeout-minutes: 2
        run: python3 tools/ci/collect_song_page_trace.py --device "$DEVICE_ID" --output ci-out/song-page-trace
      - name: Finalize compact shard diagnostics immediately
        if: always()
        env:
          TOUR_SHARD: ${{ matrix.shard }}
          TOUR_BUILD_OUTCOME: ${{ steps.build.outcome }}
          TOUR_SHARED_BUILD_REQUIRED: "1"
          TOUR_TEST_OUTCOME: ${{ steps.tests.outcome }}
          TOUR_PRIMING_OUTCOME: ${{ steps.warmup.outcome }}
        run: |
          mkdir -p ci-out
          python3 tools/ci/tour_evidence.py record ci-out
          for log in ci-out/build.log ci-out/test.log; do
            [ ! -f "$log" ] || python3 tools/ci/summarize-log.py "$log" "${log%.log}.summary.txt"
          done
      - name: Upload compact shard diagnostics before attachments
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: tour-logs-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            ci-out/*.log
            ci-out/*.summary.txt
            ci-out/outcome.json
            ci-out/shared-build.json
            ci-out/warmup/status.json
            ci-out/warmup/*.log
            ci-out/warmup/diagnostic-only.png
            ci-out/warmup-cleanup/
            ci-out/song-page-trace/
          if-no-files-found: error
          retention-days: 14
      - name: Export simulator screenshots
        if: always()
        timeout-minutes: 5
        run: |
          if [ -d ios/build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/build/UITests.xcresult --output-path ci-out/screenshots
          else
            echo "::error::Missing UI result bundle; compact logs are diagnostic only"
            exit 1
          fi
          for log in ci-out/build.log ci-out/test.log; do [ -f "$log" ] && python3 tools/ci/summarize-log.py "$log" "${log%.log}.summary.txt"; done
          gzip -f ci-out/build.log ci-out/test.log 2>/dev/null || true
      # Original still frames and metadata stay retrievable without recordings or the result bundle.
      # The shared consumer covers every class shard; the full exports below remain unchanged.
      - name: Upload original tour frames and metadata before full exports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: tour-frames-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            ci-out/screenshots/**/*.png
            ci-out/screenshots/**/*.txt
            ci-out/screenshots/**/*.json
            !ci-out/screenshots/**/*.xcresult/**
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ${{ matrix.artifact }}-attempt-${{ github.run_attempt }}
          path: ci-out
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ios-tour-evidence-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            ios/build/*.xcresult
          retention-days: 14

  archive:
    # Exactly one unsigned Release archive, independent of every simulator shard.
    # Scheduling only: retain independent evidence on producer failure/skip, but honor workflow cancellation.
    needs: tour-build
    if: >-
      always() && !cancelled()
      && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'captures'))
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios && xcodegen generate
      - name: Ensure Metal toolchain
        run: bash tools/ci/ensure-metal.sh
      - name: Archive unsigned iOS app
        run: |
          set -o pipefail
          mkdir -p ci-out
          xcodebuild archive -project ios/Timbre.xcodeproj -scheme Timbre -destination 'generic/platform=iOS' -archivePath ios/build/Timbre.xcarchive CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-out/archive.log
      - name: Summarize archive before uploading its bundle
        if: always()
        run: |
          if [ -f ci-out/archive.log ]; then
            python3 tools/ci/summarize-log.py ci-out/archive.log ci-out/archive.summary.txt
            gzip -f ci-out/archive.log
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: results-archive
          path: ci-out
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ios-evidence
          path: ios/build/Timbre.xcarchive
          if-no-files-found: error
          retention-days: 14

  ipad:
    # The build, the Full Screen Apps reboot and both orientations' captures take about 25 minutes on a busy runner.
    # Scheduling only: retain independent evidence on producer failure/skip, but honor workflow cancellation.
    needs: tour-build
    if: >-
      always() && !cancelled()
      && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'captures'))
    timeout-minutes: 45
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Verify iPad SDK environment
        run: |
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          test "${SDK_VERSION%%.*}" -ge 26
      - name: Generate baseline Xcode project
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios && xcodegen generate
      - name: Select latest available 13-inch iPad simulator
        run: |
          mkdir -p ios/build
          xcrun simctl list devices available -j > ios/build/ipad-simulators.json
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          devices = json.loads(Path('ios/build/ipad-simulators.json').read_text())['devices']
          version = lambda value: tuple(map(int, re.findall(r'\d+', value)))
          for runtime, available in sorted(devices.items(), key=lambda item: version(item[0]), reverse=True):
              if 'iOS' not in runtime:
                  continue
              candidates = [device for device in available if 'iPad' in device['name'] and re.search(r'\b13[- ]inch\b', device['name'])]
              if not candidates:
                  continue
              device = max(candidates, key=lambda value: ('Pro' in value['name'], version(value['name'])))
              print(f"Using {device['name']} on {runtime}: {device['udid']}")
              with open(os.environ['GITHUB_ENV'], 'a') as environment:
                  environment.write(f"IPAD_DEVICE_ID={device['udid']}\n")
              break
          else:
              raise SystemExit('No available 13-inch iPad simulator; tablet verification cannot use a smaller device.')
          PY
      - name: Ensure Metal toolchain
        run: bash tools/ci/ensure-metal.sh
      - name: Boot the iPad in Full Screen Apps with the marketing status bar (9:41, full battery and signal)
        run: |
          xcrun simctl boot "$IPAD_DEVICE_ID" || true
          xcrun simctl bootstatus "$IPAD_DEVICE_ID" -b
          # iPadOS 26 starts in Windowed Apps, which draws the window-resize arc in the app's bottom-right corner, on
          # every iPad capture. Full Screen Apps (Settings > Multitasking & Gestures) has none. The mode is two private
          # SpringBoard defaults, both off for Full Screen Apps; SpringBoard reads them only as it starts, so a device
          # without them gets them written and boots once more. They persist on the device (the retry's reboot keeps
          # them). Should a later iPadOS ignore them, the step says so and the captures carry the arc again.
          keys="SBMedusaMultitaskingEnabled SBChamoisWindowingEnabled"
          full_screen() {
            for key in $keys; do
              [ "$(xcrun simctl spawn "$IPAD_DEVICE_ID" defaults read com.apple.springboard "$key" 2>/dev/null)" = "0" ] || return 1
            done
          }
          for attempt in 1 2; do
            full_screen && break
            echo "Switching the iPad to Full Screen Apps (attempt $attempt)"
            for key in $keys; do
              xcrun simctl spawn "$IPAD_DEVICE_ID" defaults write com.apple.springboard "$key" -bool NO || true
            done
            # Let cfprefsd write the domain out before the shutdown, then boot with the new mode.
            sleep 2
            xcrun simctl shutdown "$IPAD_DEVICE_ID" || true
            xcrun simctl boot "$IPAD_DEVICE_ID" || true
            xcrun simctl bootstatus "$IPAD_DEVICE_ID" -b
          done
          # SpringBoard can still be settling into the new mode after bootstatus returns; the UI test's launch then
          # hangs ("does not have a process ID"). Prove an app launches first; if none does, go back to the default
          # mode rather than lose the iPad run (the captures then carry the arc, with a warning).
          launches() {
            for try in 1 2 3 4 5 6; do
              if xcrun simctl launch "$IPAD_DEVICE_ID" com.apple.Preferences >/dev/null 2>&1; then
                sleep 2; xcrun simctl terminate "$IPAD_DEVICE_ID" com.apple.Preferences >/dev/null 2>&1 || true
                return 0
              fi
              sleep 10
            done
            return 1
          }
          if full_screen && launches; then
            echo "The iPad runs in Full Screen Apps: no window-resize arc in the captures"
          else
            echo "::warning::The iPad simulator did not run apps in Full Screen Apps; back to the default mode, so the iPad captures may show the window-resize arc"
            for key in $keys; do
              xcrun simctl spawn "$IPAD_DEVICE_ID" defaults delete com.apple.springboard "$key" >/dev/null 2>&1 || true
            done
            sleep 2
            xcrun simctl shutdown "$IPAD_DEVICE_ID" || true
            xcrun simctl boot "$IPAD_DEVICE_ID" || true
            xcrun simctl bootstatus "$IPAD_DEVICE_ID" -b
            launches || echo "::warning::No app launched on the iPad simulator after the reset either"
          fi
          # The iPad store frames come from these captures: Apple's 9:41 status bar, not the runner's clock. Set after
          # the last boot (a reboot drops it).
          xcrun simctl status_bar "$IPAD_DEVICE_ID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 \
            || xcrun simctl status_bar "$IPAD_DEVICE_ID" override --time 9:41 \
            || echo "::warning::Could not override the simulator status bar; the captures show the real time"
      - name: Run real iPad portrait and landscape screenshots
        run: |
          set -o pipefail
          mkdir -p ci-out
          # A reboot drops the status bar override: set it again after one.
          status_bar() {
            xcrun simctl bootstatus "$IPAD_DEVICE_ID" -b
            xcrun simctl status_bar "$IPAD_DEVICE_ID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 \
              || xcrun simctl status_bar "$IPAD_DEVICE_ID" override --time 9:41 || true
          }
          run() { xcodebuild test -project ios/Timbre.xcodeproj -scheme Timbre -parallel-testing-enabled NO -only-testing:TimbreUITests/TabletScreenshotsUITests -destination "platform=iOS Simulator,id=$IPAD_DEVICE_ID" -resultBundlePath ios/build/TabletScreenshots.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee -a ci-out/ipad-test.log; }
          # The hosted simulator sometimes fails to bring up accessibility for the test runner; that is not a test failure.
          if ! run; then
            grep -q "failed to initialize for UI testing" ci-out/ipad-test.log || exit 1
            echo "Test runner failed to start; rebooting the simulator and retrying once"
            xcrun simctl shutdown "$IPAD_DEVICE_ID" || true; xcrun simctl boot "$IPAD_DEVICE_ID" || true
            status_bar
            rm -rf ios/build/TabletScreenshots.xcresult
            run
          fi
      - name: Export iPad screenshot attachments
        if: always()
        run: |
          if [ -d ios/build/TabletScreenshots.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/build/TabletScreenshots.xcresult --output-path ci-out/ipad-screenshots || true
          fi
          [ -f ci-out/ipad-test.log ] && python3 tools/ci/summarize-log.py ci-out/ipad-test.log ci-out/ipad-test.summary.txt
          gzip -f ci-out/ipad-test.log 2>/dev/null || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: results-ipad
          path: ci-out
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ipad-evidence
          path: ios/build/
          retention-days: 14

  a11y-matrix:
    # The screens where layout breaks first, under one setting per run (AccessibilityMatrixUITests): the largest
    # text size, Bold Text, Increase Contrast, left-handed, left-handed upside down and Arabic. Pictures and audit
    # reports for review; a screen that can't be reached fails.
    # Scheduling only: retain independent evidence on producer failure/skip, but honor workflow cancellation.
    needs: tour-build
    if: >-
      always() && !cancelled()
      && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'captures') || contains(github.event.pull_request.labels.*.name, 'accessibility'))
    timeout-minutes: 75
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios && xcodegen generate
      - name: Select an iPhone simulator and boot it
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin); runtimes=sorted(d["devices"].items(),key=lambda pair:tuple(map(int,re.findall(r"\d+",pair[0]))),reverse=True); print(next(x["udid"] for k,v in runtimes if "iOS" in k for x in v if "iPhone" in x["name"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
      - name: Ensure Metal toolchain
        run: bash tools/ci/ensure-metal.sh
      - name: Build app and tests
        run: |
          set -o pipefail
          mkdir -p ios/build ci-out
          xcodebuild build-for-testing -project ios/Timbre.xcodeproj -scheme Timbre -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath ios/build/dd COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-out/build.log | tail -40 | tee ci-out/build-tail.log
      # Publish compiler diagnostics before tests or the independent Release archive can delay them.
      - name: Summarize simulator build immediately
        if: always() && hashFiles('ci-out/build.log') != ''
        run: python3 tools/ci/summarize-log.py ci-out/build.log ci-out/build.summary.txt
      - name: Upload simulator build checkpoint
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && hashFiles('ci-out/build.log') != ''
        with:
          name: nightly-build-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ci-out/build.log
            ci-out/build.summary.txt
          if-no-files-found: error
          retention-days: 14
      - name: Every variant
        run: |
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl privacy "$DEVICE_ID" grant microphone com.shahradazerisharghi.timbre || true
          # Simulator settings for the variants that are system settings (best effort: a setting the simulator
          # refuses leaves that variant as the baseline, and the step says so).
          setting() {
            case "$1:$2" in
              contrast:on) xcrun simctl ui "$DEVICE_ID" increase_contrast enabled || echo "::warning::Increase Contrast could not be set" ;;
              contrast:off) xcrun simctl ui "$DEVICE_ID" increase_contrast disabled || true ;;
              bold:on) xcrun simctl spawn "$DEVICE_ID" defaults write com.apple.Accessibility EnhancedTextLegibilityEnabled -bool YES || echo "::warning::Bold Text could not be set" ;;
              bold:off) xcrun simctl spawn "$DEVICE_ID" defaults write com.apple.Accessibility EnhancedTextLegibilityEnabled -bool NO || true ;;
            esac
          }
          status=0
          for variant in baseline ax5 bold contrast lefty upside ar; do
            setting "$variant" on
            TEST_RUNNER_TIMBRE_MATRIX="$variant" xcodebuild test-without-building -project ios/Timbre.xcodeproj -scheme Timbre \
              -parallel-testing-enabled NO -only-testing:TimbreUITests/AccessibilityMatrixUITests \
              -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath ios/build/dd \
              -resultBundlePath "ios/build/Matrix-$variant.xcresult" CODE_SIGNING_ALLOWED=NO > "ci-out/matrix-$variant.log" 2>&1 \
              || { status=1; echo "::error::The $variant run failed (ci-out/matrix-$variant.log)"; }
            setting "$variant" off
            tail -5 "ci-out/matrix-$variant.log"
          done
          exit $status
      - name: Collect results
        if: always()
        run: |
          for bundle in ios/build/Matrix-*.xcresult; do
            [ -d "$bundle" ] || continue
            name=$(basename "$bundle" .xcresult)
            xcrun xcresulttool export attachments --path "$bundle" --output-path "ci-out/$name" || true
          done
          gzip -f ci-out/matrix-*.log 2>/dev/null || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: results-a11y-matrix
          path: ci-out
          retention-days: 14

  tsan:
    # The engine's tests under the thread sanitizer: data races the compiler's checking can't see.
    # Scheduling only: retain independent evidence on producer failure/skip, but honor workflow cancellation.
    needs: tour-build
    if: >-
      always() && !cancelled()
      && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'captures'))
    # A full suite took 28m05 before setup/build; another reached 30m with only 427 completions.
    # Leave bounded runner-variation headroom without filtering tests or weakening the sanitizer.
    timeout-minutes: 45
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Swift core tests with the thread sanitizer
        run: |
          set -o pipefail
          mkdir -p ci-out
          swift test --package-path ios --sanitize=thread 2>&1 | tee ci-out/tsan.log
      - name: Summarize
        if: always()
        run: |
          python3 tools/ci/summarize-log.py ci-out/tsan.log ci-out/tsan.summary.txt || true
          gzip -f ci-out/tsan.log 2>/dev/null || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: results-tsan
          path: ci-out
          retention-days: 14

  publish:
    # The only job that writes to the repository (see ios.yml): ci-results/app (the tour and its captures),
    # ci-results/ipad, ci-results/a11y-matrix and ci-results/tsan.
    name: publish results
    if: >-
      always()
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (needs['tour-build'].result != 'skipped' || needs.tour.result != 'skipped' || needs.archive.result != 'skipped' || needs.ipad.result != 'skipped'
          || needs['a11y-matrix'].result != 'skipped' || needs.tsan.result != 'skipped')
    needs: [tour-build, tour, archive, ipad, a11y-matrix, tsan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          sparse-checkout: tools/ci
      # Named destinations keep partial-run evidence under the directories the publisher consumes.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: results-tour-attempt-${{ github.run_attempt }}
          path: results/results-tour
      # Preserve capture screenshot paths; other shards have isolated logs/manifests underneath.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          pattern: results-tour-*-attempt-${{ github.run_attempt }}
          path: results/results-tour/shards
          merge-multiple: false
      # Compact checkpoints survive even when expensive attachment export/upload cannot finish.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          pattern: tour-logs-*-attempt-${{ github.run_attempt }}
          path: results/results-tour/checkpoints
          merge-multiple: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: results-archive
          path: results/results-tour/archive
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: results-ipad
          path: results/results-ipad
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: results-a11y-matrix
          path: results/results-a11y-matrix
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: results-tsan
          path: results/results-tsan
      - name: Require every shard outcome without hiding partial evidence
        if: always() && needs['tour-build'].result != 'skipped'
        env:
          TOUR_SHARED_BUILD_REQUIRED: "1"
          TOUR_PRODUCER_OUTCOME: ${{ needs['tour-build'].result }}
          TOUR_JOB_OUTCOME: ${{ needs.tour.result }}
          TOUR_ARCHIVE_OUTCOME: ${{ needs.archive.result }}
        run: python3 tools/ci/tour_evidence.py aggregate results/results-tour
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pair in tour:app ipad:ipad a11y-matrix:a11y-matrix tsan:tsan; do
            job="${pair%%:*}"; branch="ci-results/${pair##*:}"
            [ -d "results/results-$job" ] || { echo "No results from $job"; continue; }
            bash tools/ci/publish-results.sh "$branch" "results/results-$job" "$job" || echo "::warning::Could not publish $job results"
          done

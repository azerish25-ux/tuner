name: Watch captures
on:
  push:
    branches: [main, codex/app-store-readiness-gates]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # An ordinary push must not replace explicitly requested full capture evidence.
  group: >-
    watch-captures-${{ github.ref }}-${{
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[watch-captures-all]')) && 'requested' || 'noop' }}
  cancel-in-progress: false
jobs:
  capture:
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/app-store-readiness-gates') &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[watch-captures-all]'))
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Generate existing Xcode project
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios && xcodegen generate
      - name: Verify capture validator and native tool capabilities
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/l10n/tests -p test_watch_captures.py
          xcodebuild -version
          mkdir -p ci-out/watch
          xcrun simctl help io > ci-out/watch/simctl-io-help.txt 2>&1
      - name: Capture all 52 app languages (104 images) and map all 50 store locales
        run: |
          set -euo pipefail
          python3 tools/ci/watch_captures.py --out ci-out/watch --revision "$GITHUB_SHA"
          python3 tools/ci/watch_captures.py --out ci-out/watch --revision "$GITHUB_SHA" --validate
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: watch-captures-${{ github.sha }}
          path: |
            ci-out/watch/**/*.jpg
            ci-out/watch/**/*.png
            ci-out/watch/*.json
            ci-out/watch/*.log
            ci-out/watch/*.txt
          if-no-files-found: warn
          retention-days: 14

# Manual owner handoff only. Never dispatch this workflow before Apple delivery is authorized.
# Signing uses Xcode automatic signing authenticated with an App Store Connect API key, so the
# app and its widget extension (and their App Group) are provisioned without hand-made profiles.
# https://developer.apple.com/documentation/xcode/distributing-your-app-for-beta-testing-and-releases
name: Apple delivery
on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: App Store version (for example 2.0.0)
        required: true
        default: '2.0.0'
        type: string
      build_number:
        description: Unique positive build number not already uploaded for this version
        required: true
        type: string
      confirm_delivery:
        description: I authorize signing and uploading this revision to App Store Connect
        required: true
        default: false
        type: boolean
      internal_testflight_untranslated:
        description: INTERNAL TESTFLIGHT ONLY - skip the translation gate. The build is exported for internal testers only (it can't be submitted for App Store review or external testing) and stamped TimbreBuildChannel=internal
        required: false
        default: false
        type: boolean
      ship_min_coverage:
        description: Ship only the languages with at least this percent of the interface translated (tools/l10n/shipping.py); empty ships the committed CFBundleLocalizations
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: apple-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: ${{ inputs.confirm_delivery }}
    environment: apple-delivery
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      TELEMETRYDECK_APP_ID: ${{ vars.TELEMETRYDECK_APP_ID }}
      # Optional repository variables for the addresses in Info.plist (ios/project.yml); unset keeps the project's value.
      TIMBRE_APP_STORE_ID: ${{ vars.TIMBRE_APP_STORE_ID }}
      TIMBRE_SHARE_URL: ${{ vars.TIMBRE_SHARE_URL }}
      TIMBRE_REMOTE_CONFIG_URL: ${{ vars.TIMBRE_REMOTE_CONFIG_URL }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      SHIP_MIN_COVERAGE: ${{ inputs.ship_min_coverage }}
      # "internal" for a build that skipped the translation gate: exported for internal TestFlight testing only.
      BUILD_CHANNEL: ${{ inputs.internal_testflight_untranslated && 'internal' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate inputs and credentials without displaying values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          required = ['APPLE_TEAM_ID', 'APP_STORE_CONNECT_KEY_ID', 'APP_STORE_CONNECT_ISSUER_ID', 'APP_STORE_CONNECT_API_KEY_P8']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing apple-delivery environment secrets: ' + ', '.join(missing))
          for name, pattern in [('APPLE_TEAM_ID', r'[A-Z0-9]{10}'),
                                ('APP_STORE_CONNECT_KEY_ID', r'[A-Z0-9]{10}'),
                                ('APP_STORE_CONNECT_ISSUER_ID', r'[A-Fa-f0-9-]{36}'),
                                ('MARKETING_VERSION', r'[0-9]+\.[0-9]+(?:\.[0-9]+)?'),
                                ('BUILD_NUMBER', r'[1-9][0-9]{0,8}'),
                                ('SHIP_MIN_COVERAGE', r'(?:[0-9]{1,2}(?:\.[0-9]+)?|100)?')]:
              if not re.fullmatch(pattern, os.environ[name]):
                  raise SystemExit('Invalid format for ' + name)
          if 'BEGIN PRIVATE KEY' not in os.environ['APP_STORE_CONNECT_API_KEY_P8']:
              raise SystemExit('APP_STORE_CONNECT_API_KEY_P8 must be the raw .p8 contents including the BEGIN/END lines.')
          PY
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${SDK_VERSION%%.*}" -ge 26
      - name: Verify core and resources before signing
        run: |
          set -euo pipefail
          swift test --package-path ios --parallel
          python3 tools/verify-ios-resources.py
      - name: Generate Xcode project for English localization export
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios && xcodegen generate
      - name: Export authoritative English keys from this revision
        run: |
          set -euo pipefail
          mkdir -p ci-out
          xcodebuild -exportLocalizations -project ios/Timbre.xcodeproj -localizationPath ci-out/l10n -exportLanguage en \
            SWIFT_EMIT_LOC_STRINGS=YES CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-out/export.log
          XLIFF=ci-out/l10n/en.xcloc/Localized\ Contents/en.xliff
          test -s "$XLIFF"
          cp "$XLIFF" ci-out/en.xliff
          python3 tools/l10n/shipping.py --xliff ci-out/en.xliff
      - name: Complete interface in all 49 app languages
        if: ${{ !inputs.internal_testflight_untranslated }}
        run: python3 tools/l10n/shipping.py --xliff ci-out/en.xliff --require-complete
        # Selecting fewer shipped languages never waives the complete-interface requirement.
      - name: Choose the shipped languages
        # The owner's bar for this upload: CFBundleLocalizations and the build's .lproj folders keep only the locales
        # with at least SHIP_MIN_COVERAGE percent of the interface translated (this checkout only; nothing is committed).
        if: ${{ inputs.ship_min_coverage != '' }}
        run: |
          set -euo pipefail
          python3 tools/l10n/shipping.py --xliff ci-out/en.xliff --min "$SHIP_MIN_COVERAGE" --critical --apply | tee shipping.txt
          { echo "### Languages in this build"; echo; echo '```'; tail -3 shipping.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Full lesson coverage in all 49 app languages
        if: ${{ !inputs.internal_testflight_untranslated }}
        run: python3 tools/l10n/lessons.py --strict
        # A UI percentage or a reduced shipping set never waives the all-language lesson requirement.
      - name: Legal, permission and VoiceOver strings in every shipped language
        # The paywall's renewal terms, the permission prompts and VoiceOver's words must be translated in every
        # language the app ships (tools/l10n/critical.py), in addition to the complete-interface check above.
        # Deliver any missing translations first. Only an internal TestFlight build skips this.
        if: ${{ !inputs.internal_testflight_untranslated }}
        run: python3 tools/l10n/critical.py --xliff ci-out/en.xliff --strict --github
      - name: Internal TestFlight build (not for App Store review)
        if: ${{ inputs.internal_testflight_untranslated }}
        run: |
          python3 tools/l10n/critical.py --xliff ci-out/en.xliff --github
          echo "::warning title=Internal TestFlight build::The translation gate was skipped. This build is exported for internal TestFlight testing only and can't be submitted for App Store review."
          { echo "## INTERNAL TESTFLIGHT BUILD"; echo
            echo "The translation gate was skipped, so this build is exported with testFlightInternalTestingOnly: App Store Connect"
            echo "offers it to internal testers only and it can't be submitted for review or external testing. Its Info.plist"
            echo "says TimbreBuildChannel = internal."; } >> "$GITHUB_STEP_SUMMARY"
      - name: Regenerate Xcode project with selected shipping languages
        run: |
          set -euo pipefail
          cd ios && xcodegen generate
      - name: Install the API key for this job only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          DELIVERY_DIRECTORY="$RUNNER_TEMP/apple-delivery"
          mkdir -p "$DELIVERY_DIRECTORY"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$DELIVERY_DIRECTORY/AuthKey.p8"
          echo "DELIVERY_DIRECTORY=$DELIVERY_DIRECTORY" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, pathlib, plistlib
          directory = pathlib.Path(os.environ['DELIVERY_DIRECTORY'])
          options = {'method': 'app-store-connect', 'destination': 'upload', 'signingStyle': 'automatic',
                     'teamID': os.environ['APPLE_TEAM_ID'], 'manageAppVersionAndBuildNumber': False, 'uploadSymbols': True}
          if os.environ.get('BUILD_CHANNEL') == 'internal':
              # A build that skipped the translation gate goes to internal testers only: App Store Connect won't let it
              # be submitted for review or sent to external testers.
              options['testFlightInternalTestingOnly'] = True
          (directory / 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY
      - name: Ensure Metal toolchain
        run: bash tools/ci/ensure-metal.sh
      - name: Archive Release with automatic signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/Timbre.xcodeproj -scheme Timbre -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$DELIVERY_DIRECTORY/Timbre.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$DELIVERY_DIRECTORY/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            TIMBRE_BUILD_CHANNEL="${BUILD_CHANNEL:-}" \
            TIMBRE_TELEMETRY_APP_ID="${TELEMETRYDECK_APP_ID:-}" TIMBRE_APP_STORE_ID="${TIMBRE_APP_STORE_ID:-}" \
            TIMBRE_SHARE_URL="${TIMBRE_SHARE_URL:-}" TIMBRE_REMOTE_CONFIG_URL="${TIMBRE_REMOTE_CONFIG_URL:-}" archive
      - name: Export, sign and upload to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath "$DELIVERY_DIRECTORY/Timbre.xcarchive" \
            -exportOptionsPlist "$DELIVERY_DIRECTORY/ExportOptions.plist" -exportPath "$DELIVERY_DIRECTORY/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$DELIVERY_DIRECTORY/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          echo 'Upload accepted. Apple processing and TestFlight availability must be checked in App Store Connect.' >> "$GITHUB_STEP_SUMMARY"
          if [ "${BUILD_CHANNEL:-}" = "internal" ]; then
            echo 'This upload is internal TestFlight only: it cannot be submitted for App Store review.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove the API key
        if: ${{ always() }}
        run: rm -rf "${DELIVERY_DIRECTORY:-$RUNNER_TEMP/apple-delivery}"

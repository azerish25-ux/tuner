# Manual owner handoff only. Never dispatch this workflow before Apple delivery is authorized.
# Signing uses Xcode automatic signing authenticated with an App Store Connect API key, so the
# app and its widget extension (and their App Group) are provisioned without hand-made profiles.
# https://developer.apple.com/documentation/xcode/distributing-your-app-for-beta-testing-and-releases
name: Apple delivery
on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: App Store version (for example 2.0.0)
        required: true
        default: '2.0.0'
        type: string
      build_number:
        description: Unique positive build number not already uploaded for this version
        required: true
        type: string
      confirm_delivery:
        description: I authorize signing and uploading this revision to App Store Connect
        required: true
        default: false
        type: boolean
      allow_untranslated:
        description: Upload even if a shipped language lacks a legal, permission or VoiceOver string (internal TestFlight only, never an App Store release)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: apple-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: ${{ inputs.confirm_delivery }}
    environment: apple-delivery
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      TELEMETRYDECK_APP_ID: ${{ vars.TELEMETRYDECK_APP_ID }}
      # Optional repository variables for the addresses in Info.plist (ios/project.yml); unset keeps the project's value.
      TIMBRE_APP_STORE_ID: ${{ vars.TIMBRE_APP_STORE_ID }}
      TIMBRE_SHARE_URL: ${{ vars.TIMBRE_SHARE_URL }}
      TIMBRE_REMOTE_CONFIG_URL: ${{ vars.TIMBRE_REMOTE_CONFIG_URL }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate inputs and credentials without displaying values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          required = ['APPLE_TEAM_ID', 'APP_STORE_CONNECT_KEY_ID', 'APP_STORE_CONNECT_ISSUER_ID', 'APP_STORE_CONNECT_API_KEY_P8']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing apple-delivery environment secrets: ' + ', '.join(missing))
          for name, pattern in [('APPLE_TEAM_ID', r'[A-Z0-9]{10}'),
                                ('APP_STORE_CONNECT_KEY_ID', r'[A-Z0-9]{10}'),
                                ('APP_STORE_CONNECT_ISSUER_ID', r'[A-Fa-f0-9-]{36}'),
                                ('MARKETING_VERSION', r'[0-9]+\.[0-9]+(?:\.[0-9]+)?'),
                                ('BUILD_NUMBER', r'[1-9][0-9]{0,8}')]:
              if not re.fullmatch(pattern, os.environ[name]):
                  raise SystemExit('Invalid format for ' + name)
          if 'BEGIN PRIVATE KEY' not in os.environ['APP_STORE_CONNECT_API_KEY_P8']:
              raise SystemExit('APP_STORE_CONNECT_API_KEY_P8 must be the raw .p8 contents including the BEGIN/END lines.')
          PY
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${SDK_VERSION%%.*}" -ge 26
      - name: Verify core and resources before signing
        run: |
          set -euo pipefail
          swift test --package-path ios --parallel
          python3 tools/verify-ios-resources.py
      - name: Legal, permission and VoiceOver strings in every shipped language
        # The paywall's renewal terms, the permission prompts and VoiceOver's words must be translated in every
        # language the app ships (tools/l10n/critical.py). Ship fewer languages or deliver the translations first.
        if: ${{ !inputs.allow_untranslated }}
        run: python3 tools/l10n/critical.py --strict --github
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Install the API key for this job only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          DELIVERY_DIRECTORY="$RUNNER_TEMP/apple-delivery"
          mkdir -p "$DELIVERY_DIRECTORY"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$DELIVERY_DIRECTORY/AuthKey.p8"
          echo "DELIVERY_DIRECTORY=$DELIVERY_DIRECTORY" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, pathlib, plistlib
          directory = pathlib.Path(os.environ['DELIVERY_DIRECTORY'])
          options = {'method': 'app-store-connect', 'destination': 'upload', 'signingStyle': 'automatic',
                     'teamID': os.environ['APPLE_TEAM_ID'], 'manageAppVersionAndBuildNumber': False, 'uploadSymbols': True}
          (directory / 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY
      - name: Ensure Metal toolchain
        run: bash tools/ci/ensure-metal.sh
      - name: Archive Release with automatic signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/Timbre.xcodeproj -scheme Timbre -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$DELIVERY_DIRECTORY/Timbre.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$DELIVERY_DIRECTORY/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            TIMBRE_TELEMETRY_APP_ID="${TELEMETRYDECK_APP_ID:-}" TIMBRE_APP_STORE_ID="${TIMBRE_APP_STORE_ID:-}" \
            TIMBRE_SHARE_URL="${TIMBRE_SHARE_URL:-}" TIMBRE_REMOTE_CONFIG_URL="${TIMBRE_REMOTE_CONFIG_URL:-}" archive
      - name: Export, sign and upload to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath "$DELIVERY_DIRECTORY/Timbre.xcarchive" \
            -exportOptionsPlist "$DELIVERY_DIRECTORY/ExportOptions.plist" -exportPath "$DELIVERY_DIRECTORY/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$DELIVERY_DIRECTORY/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          echo 'Upload accepted. Apple processing and TestFlight availability must be checked in App Store Connect.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the API key
        if: ${{ always() }}
        run: rm -rf "${DELIVERY_DIRECTORY:-$RUNNER_TEMP/apple-delivery}"

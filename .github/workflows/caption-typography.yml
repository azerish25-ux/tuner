name: Store caption typography
on:
  push:
    branches: [main, codex/app-store-readiness-gates]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: caption-typography-${{ github.ref }}
  cancel-in-progress: false
jobs:
  captions:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/codex/app-store-readiness-gates' && contains(github.event.head_commit.message, '[caption-typography]'))))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: |
          python -m pip install -r tools/marketing/requirements.txt
      - name: Verify font selection and fail-closed rendering contracts
        run: python -m unittest discover -s tools/marketing/tests
      - name: Verify every listing caption with pinned licensed fonts
        run: timeout 300s python tools/marketing/font_assets.py --audit --out ci-out/caption-typography.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: caption-typography
          path: ci-out
          retention-days: 14

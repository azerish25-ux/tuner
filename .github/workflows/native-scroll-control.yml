name: Native scroll platform control
on:
  push:
    branches: [codex/scroll-platform-control-31bcd46]
permissions:
  contents: read
concurrency:
  group: native-scroll-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r tools/marketing/requirements.txt
      - run: python3 -m unittest discover -s tools/marketing/tests -p 'test_*.py'
  native-control:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Generate project and select simulator
        run: |
          set -euo pipefail
          mkdir -p ci-out
          git rev-parse HEAD > ci-out/source-revision.txt
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd .diagnostics/native-scroll-control && xcodegen generate)
          xcrun simctl list devices available -j > ci-out/devices.json
          DEVICE_ID=$(python3 -c 'import json,re; d=json.load(open("ci-out/devices.json")); runtimes=sorted(d["devices"].items(),key=lambda p:tuple(map(int,re.findall(r"\d+",p[0]))),reverse=True); print(next(x["udid"] for k,v in runtimes if "iOS" in k for x in v if x["name"]=="iPhone 17 Pro"))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Run eight diagnostic native controls
        run: |
          set -o pipefail
          xcodebuild test -project .diagnostics/native-scroll-control/NativeScrollControl.xcodeproj \
            -scheme NativeScrollControl -parallel-testing-enabled NO \
            -only-testing:NativeScrollControlTests/NativeScrollTrackingControlTests \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 120 \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath ios/build/dd \
            -resultBundlePath ci-out/Control.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-out/test.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('ci-out/test.log').read_text()
          expected = {'test' + storage + reader + direction
                      for storage in ('', 'State') for reader in ('SingleReader', 'NestedReader')
                      for direction in ('LeftToRight', 'RightToLeft')}
          passed = re.findall(r"Test Case '-\[NativeScrollControlTests.NativeScrollTrackingControlTests (test\w+)\]' passed", text)
          if len(passed) != 8 or set(passed) != expected or text.count('NATIVE_SCROLL_PLATFORM_CONTROL ') != 8:
              raise SystemExit('Missing, duplicate or incomplete native diagnostic controls')
          PY
      - name: Export original diagnostic attachments
        if: always()
        run: |
          if [ -d ci-out/Control.xcresult ]; then
            xcrun xcresulttool export attachments --path ci-out/Control.xcresult --output-path ci-out/attachments
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('ci-out/attachments')
          manifest = json.loads((root / 'manifest.json').read_text())
          reports = [json.loads((root / a['exportedFileName']).read_text())
                     for test in manifest for a in test.get('attachments', [])
                     if a.get('suggestedHumanReadableName', '').startswith('platform-scroll-')
                     and a['exportedFileName'].endswith('.json')]
          expected = {(storage, nested, direction) for storage in ('localState', 'observableObject')
                      for nested in (False, True) for direction in ('leftToRight', 'rightToLeft')}
          if len(reports) != 8 or {(r['bindingStorage'],r['nestedPrivateReader'],r['direction']) for r in reports} != expected:
              raise SystemExit('Missing or duplicate control metadata')
          for report in reports:
              samples = report['samples']
              if len(samples) != 31 or report['diagnosticOnly'] is not True or report['productionAcceptance'] is not False:
                  raise SystemExit('Incomplete diagnostic observation window')
              if type(report['nestedPrivateReader']) is not bool or report['geometryPlaced'] is not True:
                  raise SystemExit('Invalid control geometry metadata')
              times = [s['secondsSinceCommand'] for s in samples]
              if times != sorted(times) or times[-1] - times[0] < 2.9:
                  raise SystemExit('Late observations were not preserved')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: native-scroll-platform-control
          path: ci-out
          retention-days: 14

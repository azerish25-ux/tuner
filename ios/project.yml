name: Timbre
options:
  bundleIdPrefix: com.shahradazerisharghi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
packages:
  TimbreCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.10"
    TIMBRE_ADMOB_APP_ID: ""
    TIMBRE_ADMOB_INTERSTITIAL_ID: ""
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Timbre:
    type: application
    platform: iOS
    sources:
      - path: Timbre
        excludes: [Resources]
      - path: Timbre/Resources
        buildPhase: resources
    dependencies:
      - package: TimbreCore
    info:
      path: Timbre/Info.plist
      properties:
        CFBundleDisplayName: Timbre
        NSMicrophoneUsageDescription: Timbre listens to your instrument or voice to measure pitch. Audio is processed on your device and is never saved or uploaded.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [space_grotesk.ttf, inter.ttf, ibm_plex_mono.ttf]
        TIMBRE_ADMOB_APP_ID: "$(TIMBRE_ADMOB_APP_ID)"
        TIMBRE_ADMOB_INTERSTITIAL_ID: "$(TIMBRE_ADMOB_INTERSTITIAL_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahradazerisharghi.timbre
        TARGETED_DEVICE_FAMILY: "1,2"
  TimbreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TimbreUITests
      - path: Tests/Fixtures/Timbre.storekit
        buildPhase: resources
    dependencies:
      - target: Timbre
  TimbreAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TimbreAppTests
      - path: Tests/Fixtures/Timbre.storekit
        buildPhase: resources
    dependencies:
      - target: Timbre
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Timbre.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Timbre"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Timbre:
    run:
      storeKitConfiguration: Tests/Fixtures/Timbre.storekit
    build:
      targets:
        Timbre: all
        TimbreUITests: [test]
        TimbreAppTests: [test]
    test:
      targets: [TimbreAppTests, TimbreUITests]
      parallelizeBuild: false
